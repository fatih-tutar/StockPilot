services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: stockpilot-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - stockpilot

  nginx:
    image: nginx:1.27-alpine
    container_name: stockpilot-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - stockpilot

  mysql:
    image: mysql:8.4
    container_name: stockpilot-mysql
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-stockpilot}"
      MYSQL_USER: "${DB_USERNAME:-stockpilot}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    volumes:
      - stockpilot-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - stockpilot

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: stockpilot-phpmyadmin
    restart: unless-stopped
    ports:
      - "${FORWARD_PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: "${DB_USERNAME:-stockpilot}"
      PMA_PASSWORD: "${DB_PASSWORD:-secret}"
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - stockpilot

networks:
  stockpilot:
    driver: bridge

volumes:
  stockpilot-mysql:

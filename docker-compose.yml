services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: stockpilot-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stockpilot

  nginx:
    image: nginx:1.27-alpine
    container_name: stockpilot-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - stockpilot

  postgres:
    image: postgres:16-alpine
    container_name: stockpilot-postgres
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE:-stockpilot}"
      POSTGRES_USER: "${DB_USERNAME:-stockpilot}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - stockpilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-stockpilot} -d ${DB_DATABASE:-stockpilot}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - stockpilot

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: stockpilot-pgadmin
    restart: unless-stopped
    ports:
      - "${FORWARD_PGADMIN_PORT:-8081}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL:-admin@example.com}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:-secret}"
    volumes:
      - stockpilot-pgadmin:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stockpilot

networks:
  stockpilot:
    driver: bridge

volumes:
  stockpilot-postgres:
  stockpilot-pgadmin:
